name: Recover missed runs

permissions:
  actions: write
  contents: read

on:
  schedule:
    # 7:00 AM Pacific. 14:00 UTC is 7am PDT and 6am PST, after the 1am collect and 3am Tuesday compose.
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - name: Restart collect or sync if today's job never started or failed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # none | busy | ok | already-retried | failed
          latest_state() {
            local workflow="$1"
            local json line
            json=$(gh run list --workflow "$workflow" --created "$TODAY" --limit 20 \
              --json status,event,conclusion,createdAt) || return 1
            line=$(echo "$json" | jq -r '
              if length == 0 then "none none none"
              else (sort_by(.createdAt) | last | "\(.status) \(.event) \(.conclusion // "none")")
              end') || return 1
            set -- $line
            local status="$1" event="$2" conclusion="$3"
            if [ "$status" = "none" ]; then
              echo "none"
            elif [ "$status" != "completed" ]; then
              echo "busy"
            elif [ "$conclusion" = "success" ]; then
              echo "ok"
            elif [ "$event" = "workflow_dispatch" ]; then
              echo "already-retried"
            else
              echo "failed"
            fi
          }

          maybe_restart() {
            local workflow="$1"
            local label="$2"
            local state
            state=$(latest_state "$workflow") || return 1
            case "$state" in
              none)
                echo "$label never started for $TODAY. Dispatching."
                gh workflow run "$workflow" --ref "${{ github.ref_name }}" || return 1
                ;;
              failed)
                echo "$label failed for $TODAY. Dispatching one later retry."
                gh workflow run "$workflow" --ref "${{ github.ref_name }}" || return 1
                ;;
              busy)
                echo "$label is still running. Leaving it alone."
                ;;
              ok)
                echo "$label already succeeded today. Leaving it alone."
                ;;
              already-retried)
                echo "$label backup retry already ran today. Leaving it alone."
                ;;
              *)
                echo "Unexpected state for $label: $state"
                return 1
                ;;
            esac
          }

          run_check() {
            TODAY=$(date -u +%Y-%m-%d) || return 1
            maybe_restart collect.yml "Daily pipeline" || return 1
            maybe_restart sync_nflverse.yml "Nflverse sync" || return 1
          }

          for attempt in 1 2 3; do
            if run_check; then
              echo "Recover check succeeded on attempt ${attempt}/3."
              exit 0
            fi
            echo "Recover check attempt ${attempt}/3 failed."
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Recover check failed after 3 attempts. It could not list or restart today's collect and compose runs."
              exit 1
            fi
            sleep $((attempt * 15))
          done
