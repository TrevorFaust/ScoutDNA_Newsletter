name: Daily collect

on:
  schedule:
    # 8:00 AM Pacific ≈ 15:00 UTC (PDT); adjust for PST if needed
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      issue_date:
        description: Issue date (YYYY-MM-DD)
        required: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: DraftDNA-NFL-Newsletter/1.0
        run: |
          DATE="${{ github.event.inputs.issue_date }}"
          if [ -z "$DATE" ]; then DATE=$(date +%Y-%m-%d); fi
          cd pipeline && python -m src.run_collect --date "$DATE"
