name: Daily pipeline

on:
  schedule:
    # 1:00 AM Pacific (issue date = yesterday PT). 08:00 UTC = PDT; use 09:00 UTC Nov-Mar (PST).
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      issue_date:
        description: Issue date (YYYY-MM-DD). Default = yesterday Pacific.
        required: false
      skip_media:
        description: Skip YouTube/podcasts (Reddit+RSS only)
        type: boolean
        default: false
      skip_compose:
        description: Skip compose entirely (collect only)
        type: boolean
        default: false
      force_daily_compose:
        description: Force a full daily edition (all 32 teams) even though it's not Monday
        type: boolean
        default: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt tzdata
          pip install yt-dlp
      - name: Resolve compose mode (Monday = weekly, otherwise none unless forced)
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.issue_date }}" ]; then
            ISSUE="${{ github.event.inputs.issue_date }}"
            DOW=$(TZ=America/Los_Angeles date -d "$ISSUE" +%u)
          else
            DOW=$(TZ=America/Los_Angeles date +%u)
            ISSUE=$(TZ=America/Los_Angeles date -d "yesterday" +%Y-%m-%d)
          fi
          FORCE_DAILY="${{ github.event.inputs.force_daily_compose }}"
          if [ "$FORCE_DAILY" = "true" ]; then
            echo "issue_date=$ISSUE" >> "$GITHUB_OUTPUT"
            echo "compose=daily" >> "$GITHUB_OUTPUT"
          elif [ "$DOW" = "1" ]; then
            if [ -z "${{ github.event.inputs.issue_date }}" ]; then
              ISSUE=$(TZ=America/Los_Angeles date +%Y-%m-%d)
            fi
            echo "issue_date=$ISSUE" >> "$GITHUB_OUTPUT"
            echo "compose=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "issue_date=$ISSUE" >> "$GITHUB_OUTPUT"
            echo "compose=none" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect (Reddit + RSS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          NEWSLETTER_TIMEZONE: America/Los_Angeles
        run: |
          echo "Issue date: ${{ steps.mode.outputs.issue_date }} (compose=${{ steps.mode.outputs.compose }})"
          cd pipeline && python -m src.run_collect --date "${{ steps.mode.outputs.issue_date }}"
      - name: Media batch (YouTube + podcasts)
        if: github.event.inputs.skip_media != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWSLETTER_TIMEZONE: America/Los_Angeles
          YOUTUBE_SKIP_WHISPER: "true"
        run: |
          cd pipeline && python -m src.run_media_batch --date "${{ steps.mode.outputs.issue_date }}" --all-teams --workers 6 --max-videos 2 --max-episodes 2
      - name: Camp signals (extract + aggregate + propose)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSLETTER_TIMEZONE: America/Los_Angeles
        run: |
          cd pipeline && python -m src.run_extract_camp_signals --date "${{ steps.mode.outputs.issue_date }}"
      - name: Compose weekly (Monday week in review)
        if: github.event.inputs.skip_compose != 'true' && steps.mode.outputs.compose == 'weekly'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSLETTER_TIMEZONE: America/Los_Angeles
        run: |
          cd pipeline && python -m src.run_compose_weekly --date "${{ steps.mode.outputs.issue_date }}"
      - name: Compose daily (all 32 teams -> in_review)
        if: github.event.inputs.skip_compose != 'true' && steps.mode.outputs.compose == 'daily'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSLETTER_TIMEZONE: America/Los_Angeles
        run: |
          cd pipeline && python -m src.run_compose --date "${{ steps.mode.outputs.issue_date }}"
